name: Publish

# Publishes to npm through trusted publishing when a version tag is pushed.
# npmjs.com must list this repository and workflow as the package's trusted publisher.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly runs the checks and the build before npm uploads the package.
      # Without setup-node's registry-url, npm authenticates through OIDC instead of a token.
      - run: npm publish --registry=https://registry.npmjs.org --access=public --provenance
